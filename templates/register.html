<!DOCTYPE html>
<html>
<head>
<title>Register User</title>
<style>
body {
    background: #f3f5f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family: Arial;
}
.card {
    background:white;
    padding:35px;
    width:380px;
    border-radius:10px;
    box-shadow:0px 4px 10px rgba(0,0,0,0.15);
    text-align:center;
}
input {
    width:95%;
    padding:10px;
    margin-top:10px;
    border-radius:5px;
    border:1px solid #ccc;
}
button {
    margin-top:15px;
    padding:10px 15px;
    width:100%;
    border:none;
    border-radius:5px;
    background:#4a70e7;
    color:white;
    font-size:16px;
}
button:hover {
    background:#335dd3;
}
</style>
</head>
<body>

<div class="card">
    <h2>Register User</h2>
    <form id="regForm">
        <input type="text" name="username" placeholder="Enter username" required>
        <button type="submit">Register</button>
    </form>
    <p id="msg"></p>
</div>

<script>
document.getElementById("regForm").onsubmit = async (e) => {
    e.preventDefault();
    let form = new FormData(e.target);
    let res = await fetch("/do_register", {	method:"POST", body:form});
    let data = await res.json();
    document.getElementById("msg").innerHTML = data.status === "success"
        ? "Registration completed!"
        : data.message;
};
</script>

</body>
</html>
